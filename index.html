<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ארכיון שיחות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EBF0ED; --surface:#FFFFFF; --surface-2:#F4F7F5; --surface-3:#E2E9E5;
  --ink:#122420; --ink-2:#4A5C57; --ink-3:#7B8B86; --line:#D3DCD7; --line-2:#E5EBE8;
  --teal:#0C5C55; --teal-2:#127A70; --teal-soft:#D9EAE5; --on-teal:#FFFFFF;
  --brass:#A86E08; --brass-2:#C98A12; --brass-soft:#F5E8CC;
  --danger:#B42318; --danger-soft:#FBE6E3;
  --heat-0:#F1F5F3; --heat-1:#CDE5DE; --heat-2:#96CDBF; --heat-3:#58AB9B; --heat-4:#24847A; --heat-5:#0C5C55;
  --wave:#B9C7C2; --wave-on:#0C5C55;
  --av-s:36%; --av-l:87%; --av-ink-l:27%;
  --shadow:0 1px 2px rgba(18,36,32,.06),0 10px 30px rgba(18,36,32,.10);
  --font:"IBM Plex Sans Hebrew","Segoe UI",system-ui,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1412; --surface:#111E1B; --surface-2:#162622; --surface-3:#1D312C;
    --ink:#E2ECE8; --ink-2:#A6B7B1; --ink-3:#70827C; --line:#263D37; --line-2:#1C302B;
    --teal:#5BBBAC; --teal-2:#77CDBF; --teal-soft:#16362F; --on-teal:#04201B;
    --brass:#E3A944; --brass-2:#EDBB62; --brass-soft:#382B12;
    --danger:#F27A6F; --danger-soft:#3A1916;
    --heat-0:#14231F; --heat-1:#173A33; --heat-2:#1D5A4F; --heat-3:#26806F; --heat-4:#3AA693; --heat-5:#6FD1BF;
    --wave:#2F4A43; --wave-on:#6FD1BF;
    --av-s:24%; --av-l:22%; --av-ink-l:80%;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1412; --surface:#111E1B; --surface-2:#162622; --surface-3:#1D312C;
  --ink:#E2ECE8; --ink-2:#A6B7B1; --ink-3:#70827C; --line:#263D37; --line-2:#1C302B;
  --teal:#5BBBAC; --teal-2:#77CDBF; --teal-soft:#16362F; --on-teal:#04201B;
  --brass:#E3A944; --brass-2:#EDBB62; --brass-soft:#382B12;
  --danger:#F27A6F; --danger-soft:#3A1916;
  --heat-0:#14231F; --heat-1:#173A33; --heat-2:#1D5A4F; --heat-3:#26806F; --heat-4:#3AA693; --heat-5:#6FD1BF;
  --wave:#2F4A43; --wave-on:#6FD1BF;
  --av-s:24%; --av-l:22%; --av-ink-l:80%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num,.r-time,.r-dur,.day-t,.tnum{font-variant-numeric:tabular-nums}
mark{background:var(--brass-soft);color:inherit;border-radius:3px;padding:0 1px}
[hidden]{display:none!important}

/* ---------- layout ---------- */
#app{display:grid;height:100vh;grid-template-columns:212px minmax(0,1fr) 0;grid-template-rows:58px minmax(0,1fr) auto;grid-template-areas:"top top top" "nav main aside" "player player player"}
#app.has-aside{grid-template-columns:212px minmax(0,1fr) minmax(360px,440px)}
header.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;inline-size:178px;flex:none;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand .mark{display:grid;place-items:center;inline-size:32px;block-size:32px;border-radius:9px;background:var(--teal);color:var(--on-teal)}
.brand .mark svg{width:20px;height:20px}
.search{flex:1;display:flex;align-items:center;gap:8px;max-inline-size:720px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 6px 0 10px;block-size:38px}
.search:focus-within{border-color:var(--teal-2);background:var(--surface)}
.search>svg{color:var(--ink-3)}
.search input{flex:1 1 auto;inline-size:0;border:0;background:none;outline:none;min-inline-size:0;block-size:100%}
.search .kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.top-actions{display:flex;gap:8px;margin-inline-start:auto}

nav.side{grid-area:nav;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--surface);border-inline-end:1px solid var(--line);overflow:auto}
.nav-b{display:flex;align-items:center;gap:10px;inline-size:100%;padding:9px 12px;border:0;border-radius:8px;background:none;color:var(--ink-2);text-align:start;font-weight:500}
.nav-b:hover{background:var(--surface-2);color:var(--ink)}
.nav-b.on{background:var(--teal-soft);color:var(--teal);font-weight:600}
.nav-b .cnt{margin-inline-start:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.side-sep{block-size:1px;background:var(--line-2);margin:12px 6px}
.side-h{font-size:12px;color:var(--ink-3);padding:0 12px 4px;font-weight:500}
.side-fav{display:flex;flex-direction:column;gap:1px}
.side-fav button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:5px 10px;border-radius:7px;text-align:start;color:var(--ink-2);font-size:13px}
.side-fav button:hover{background:var(--surface-2);color:var(--ink)}
.side-fav button.on{color:var(--teal);font-weight:600}
.side-fav .av{inline-size:22px;block-size:22px;font-size:11px}
.side-fav .t{margin-inline-start:auto;font-size:11px;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:12px;font-size:12px;color:var(--ink-3);line-height:1.6}
.side-foot b{color:var(--ink-2);font-weight:600}

main{grid-area:main;display:flex;flex-direction:column;min-block-size:0;min-inline-size:0}
#view{flex:1;overflow:auto;min-block-size:0;position:relative}
aside#aside{grid-area:aside;background:var(--surface);border-inline-start:1px solid var(--line);overflow:auto;min-block-size:0}
#app:not(.has-aside) aside#aside{display:none}

/* ---------- buttons & inputs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;block-size:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.btn.primary:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn.ai{border-color:color-mix(in srgb,var(--brass) 45%,var(--line));color:var(--brass)}
.btn.ai:hover{background:var(--brass-soft)}
.btn.sm{block-size:30px;padding:0 10px;font-size:13px}
.btn.lg{block-size:46px;padding:0 22px;font-size:16px;border-radius:10px}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn.link{border:0;background:none;color:var(--teal);padding:0 6px}
.btn.link:hover{text-decoration:underline;background:none}
.ib{display:inline-grid;place-items:center;inline-size:34px;block-size:34px;border-radius:8px;border:0;background:none;color:var(--ink-2);flex:none}
.ib:hover{background:var(--surface-2);color:var(--ink)}
.ib.sm{inline-size:28px;block-size:28px}
.ib.sm svg.i{width:16px;height:16px}
.ib.star.on{color:var(--brass-2)}
.ib.star.on svg{fill:currentColor}
.inp,select.inp{block-size:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-inline-size:0}
select.inp{padding-inline-end:6px}
.inp:focus{outline:none;border-color:var(--teal-2)}
textarea.inp{block-size:auto;padding:8px 10px;resize:vertical;line-height:1.55;inline-size:100%}
.spin{display:inline-block;inline-size:14px;block-size:14px;border:2px solid currentColor;border-inline-end-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- filter bar ---------- */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 20px 8px;background:var(--bg)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;max-inline-size:100%;overflow-x:auto;scrollbar-width:none}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button.on{background:var(--ink);color:var(--surface);font-weight:500}
.range{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.range input{block-size:32px}
.fbar select.inp,.fbar .inp{block-size:32px;font-size:13px}
.fbar .contact-in{inline-size:170px}
.wd{display:inline-flex;gap:2px}
.wd button{inline-size:28px;block-size:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;color:var(--ink-2)}
.wd button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.more-b{position:relative}
.more-b .dot{position:absolute;top:-4px;inset-inline-end:-4px;min-inline-size:16px;block-size:16px;border-radius:8px;background:var(--brass-2);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.fbar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 20px 8px}
.fbar2 label{font-size:12px;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;block-size:28px;padding:0 6px 0 10px;border-radius:999px;background:var(--teal-soft);color:var(--teal);font-size:13px;font-weight:500}
.chip button{border:0;background:none;color:inherit;display:grid;place-items:center;inline-size:20px;block-size:20px;border-radius:50%;padding:0}
.chip button:hover{background:color-mix(in srgb,var(--teal) 15%,transparent)}
.chip svg.i{width:13px;height:13px}
.chip.ai{background:var(--brass-soft);color:var(--brass)}
.resbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:4px 20px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.resbar b{color:var(--ink);font-weight:600}
.resbar .grow{flex:1}
.banner{margin:10px 20px 0;padding:10px 14px;border-radius:10px;background:var(--brass-soft);color:var(--ink);display:flex;align-items:center;gap:12px;font-size:13px}
.banner .grow{flex:1}

/* ---------- list ---------- */
.list{padding:0 12px 24px}
.day-h{position:sticky;top:0;z-index:2;display:flex;align-items:baseline;gap:10px;padding:16px 10px 8px;background:var(--bg);border-bottom:1px solid var(--line-2)}
.day-n{font-weight:600;font-size:15px}
.day-t{margin-inline-start:auto;font-weight:600;color:var(--teal);font-size:14px}
.day-c{font-size:12px;color:var(--ink-3);min-inline-size:64px;text-align:end}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--brass-soft);color:var(--brass)}
.row{display:grid;grid-template-columns:62px 34px minmax(120px,1fr) minmax(80px,200px) 62px 46px 30px 34px;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.row.sd{grid-template-columns:104px 34px minmax(120px,1fr) minmax(80px,200px) 62px 46px 30px 34px}
.row:hover{background:var(--surface)}
.row.sel{background:var(--surface);border-color:var(--teal-2)}
.row.playing .r-who b{color:var(--teal)}
.r-time{color:var(--ink-2);font-size:13px}
.av{display:grid;place-items:center;inline-size:32px;block-size:32px;border-radius:50%;background:hsl(var(--hue) var(--av-s) var(--av-l));color:hsl(var(--hue) 45% var(--av-ink-l));font-weight:600;font-size:14px;flex:none}
.av svg.i{width:15px;height:15px}
.av.lg{inline-size:48px;block-size:48px;font-size:20px}
.r-who{display:flex;flex-direction:column;min-inline-size:0;line-height:1.3}
.r-who b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-who small{color:var(--ink-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-who small:empty{display:none}
.r-tape{block-size:6px;border-radius:3px;background:var(--line-2);overflow:hidden;display:flex}
.r-tape i{display:block;block-size:100%;background:var(--teal);border-radius:3px;opacity:.8}
.row.playing .r-tape i{background:var(--brass-2);opacity:1}
.r-dur{text-align:end;font-size:13px;color:var(--ink)}
.r-flags{display:flex;gap:3px;justify-content:flex-end;align-items:center;color:var(--brass)}
.fl{font-style:normal;font-size:10px;font-weight:700;inline-size:18px;block-size:18px;border-radius:5px;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2)}
.fl.sm{background:var(--brass-soft);color:var(--brass)}
.row .ib{inline-size:30px;block-size:30px}
.row .ib.playb{color:var(--teal)}
.row .ib.playb:hover{background:var(--teal-soft)}
.row .ib.star:not(.on){opacity:0}
.row:hover .ib.star,.row .ib.star:focus-visible{opacity:1}
.sentinel{block-size:40px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:70px 24px;color:var(--ink-2)}
.empty h2{margin:0;color:var(--ink);font-size:20px}
.empty p{margin:0;max-inline-size:52ch}

.welcome{max-inline-size:640px;margin:8vh auto 0;padding:24px;text-align:center}
.welcome .reel{inline-size:120px;block-size:64px;color:var(--teal);margin-bottom:14px}
.welcome h1{font-size:34px;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
.welcome p{color:var(--ink-2);font-size:16px;margin:0 auto 22px;max-inline-size:50ch}
.welcome .small{font-size:13px;color:var(--ink-3);margin-top:16px}
.drop-hint{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--teal) 22%,transparent);display:grid;place-items:center;pointer-events:none}
.drop-hint div{background:var(--surface);padding:24px 34px;border-radius:14px;font-size:18px;font-weight:600;box-shadow:var(--shadow);border:2px dashed var(--teal)}

/* ---------- calendar ---------- */
.cal{padding:18px 22px 30px;display:flex;flex-direction:column;gap:22px}
.ymap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;min-inline-size:0}
.ym-scroll{overflow-x:auto;padding:2px 2px 6px}
.ymap-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.ymap-h h3{margin:0;font-size:14px;font-weight:600}
.ymap-h span{font-size:12px;color:var(--ink-3)}
.ym{display:grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,13px);gap:3px;inline-size:max-content}
.ym .ml{font-size:11px;color:var(--ink-3);white-space:nowrap;grid-row:1}
.ym .c{inline-size:13px;block-size:13px;border-radius:3px;background:var(--heat-0);border:0;padding:0}
.ym .c.x{background:transparent}
.ym .c.on{outline:2px solid var(--brass-2);outline-offset:1px}
.ym .c:hover{outline:2px solid var(--ink-3);outline-offset:1px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.legend i{inline-size:12px;block-size:12px;border-radius:3px;display:inline-block}
.h0{background:var(--heat-0)!important}.h1{background:var(--heat-1)!important}.h2{background:var(--heat-2)!important}.h3{background:var(--heat-3)!important}.h4{background:var(--heat-4)!important}.h5{background:var(--heat-5)!important}
.cal-main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,1fr);gap:22px;align-items:start}
.mon{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.mon-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mon-h h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.mon-h .tot{margin-inline-start:auto;text-align:end;font-size:12px;color:var(--ink-3);line-height:1.3}
.mon-h .tot b{display:block;font-size:16px;color:var(--teal);font-weight:600}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mg .wdh{font-size:12px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.dc{position:relative;aspect-ratio:1/0.86;border-radius:8px;border:1px solid transparent;background:var(--heat-0);display:flex;flex-direction:column;justify-content:space-between;padding:6px 7px;text-align:start;min-inline-size:0;overflow:hidden}
.dc.out{visibility:hidden}
.dc .dn{font-size:12px;font-weight:600;color:var(--ink-2)}
.dc .dm{font-size:13px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc.h3,.dc.h4,.dc.h5{color:#fff}.dc.h3 .dn,.dc.h4 .dn,.dc.h5 .dn{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .dc.h4,:root[data-theme="dark"] .dc.h5{color:#04201B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dc.h4,:root:not([data-theme="light"]) .dc.h5{color:#04201B}}
:root[data-theme="dark"] .dc.h4 .dn,:root[data-theme="dark"] .dc.h5 .dn{color:rgba(4,32,27,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dc.h4 .dn,:root:not([data-theme="light"]) .dc.h5 .dn{color:rgba(4,32,27,.8)}}
.dc:hover{border-color:var(--ink-3)}
.dc.today{border-color:var(--brass-2)}
.dc.on{border:2px solid var(--ink);}
.dayp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-block-size:200px}
.dayp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayp-h h2{margin:0;font-size:18px;font-weight:600}
.dayp .big{font-size:36px;font-weight:600;color:var(--teal);letter-spacing:-.02em;line-height:1.1;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.dayp .sub{color:var(--ink-3);font-size:13px;margin-bottom:14px}
.tl{margin:6px 0 14px}
.tl-track{position:relative;block-size:30px;background:var(--surface-2);border-radius:6px;border:1px solid var(--line-2)}
.tl-b{position:absolute;top:4px;bottom:4px;border:0;border-radius:3px;background:var(--teal);padding:0;min-inline-size:3px;opacity:.85}
.tl-b:hover{background:var(--brass-2);opacity:1}
.tl-ax{position:relative;block-size:16px;font-size:10px;color:var(--ink-3)}
.tl-ax span{position:absolute;transform:translateX(50%)}
.dayp .row{grid-template-columns:44px 28px minmax(0,1fr) 50px 30px;gap:8px;padding:5px 4px}
.dayp .row .r-tape,.dayp .row .r-flags,.dayp .row .ib.star{display:none}
.dayp .row .av{inline-size:28px;block-size:28px;font-size:12px}

/* ---------- people ---------- */
.ppl{padding:16px 20px 30px}
.ppl-h{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ppl-h .inp{inline-size:240px}
.ptable{inline-size:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ptable th{font-size:12px;font-weight:500;color:var(--ink-3);text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.ptable th button{border:0;background:none;padding:0;color:inherit;font:inherit}
.ptable th button.on{color:var(--teal);font-weight:600}
.ptable td{padding:8px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.ptable tr:last-child td{border-bottom:0}
.ptable tbody tr{cursor:pointer}
.ptable tbody tr:hover td{background:var(--surface-2)}
.pname{display:flex;align-items:center;gap:10px;min-inline-size:0}
.pname b{font-weight:500}
.pname small{display:block;color:var(--ink-3);font-size:12px}
.pbar{display:flex;align-items:center;gap:8px;min-inline-size:150px}
.pbar .r-tape{flex:1}
.strip{display:flex;gap:2px}
.strip i{inline-size:9px;block-size:16px;border-radius:2px;background:var(--heat-0)}

/* ---------- stats ---------- */
.stats{padding:18px 22px 34px;display:flex;flex-direction:column;gap:18px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media (min-width:1500px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.kpi{padding:16px 18px;background:var(--surface)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi button.s{border:0;background:none;padding:0;color:var(--teal);text-align:start}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.panel h3{margin:0 0 2px;font-size:15px;font-weight:600}
.panel .ps{font-size:12px;color:var(--ink-3);margin-bottom:14px}
.panel.span2{grid-column:1/-1}
.bc{display:flex;align-items:flex-end;gap:2px;block-size:170px;padding-top:16px;border-bottom:1px solid var(--line)}
.bc-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;block-size:100%;min-inline-size:0;position:relative;cursor:default}
.bc-bar{inline-size:min(100%,34px);background:var(--teal);border-radius:4px 4px 0 0;min-block-size:1px;opacity:.88}
.bc-col:hover .bc-bar{opacity:1;background:var(--teal-2)}
.bc-v{position:absolute;font-size:11px;color:var(--ink-2);white-space:nowrap;transform:translateY(-100%);padding-bottom:2px}
.bc-x{display:flex;gap:2px;font-size:11px;color:var(--ink-3);margin-top:5px}
.bc-x span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;min-inline-size:0}
.hb{display:flex;flex-direction:column;gap:7px}
.hb-r{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:13px;cursor:pointer;border-radius:6px;padding:2px 4px}
.hb-r:hover{background:var(--surface-2)}
.hb-r .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-r .b{block-size:12px;border-radius:0 4px 4px 0;background:var(--teal);opacity:.88}
.hb-r .v{text-align:end;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- aside ---------- */
.as{display:flex;flex-direction:column}
.as-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;position:sticky;top:0;background:var(--surface);z-index:3;border-bottom:1px solid var(--line-2)}
.as-title{flex:1;min-inline-size:0}
.as-title h2{margin:0;font-size:18px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.as-sub{font-size:12px;color:var(--ink-3)}
.as-meta{display:grid;grid-template-columns:1.6fr .7fr .7fr;gap:0;margin:14px 16px 0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.as-meta div{padding:8px 12px;border-inline-start:1px solid var(--line-2)}
.as-meta div:first-child{border-inline-start:0}
.as-meta span{display:block;font-size:11px;color:var(--ink-3)}
.as-meta b{font-weight:500;font-size:13px}
.as-actions{display:flex;flex-wrap:wrap;gap:6px;padding:12px 16px}
.as-sec{padding:14px 16px;border-top:1px solid var(--line-2)}
.as-sec h3{margin:0;font-size:14px;font-weight:600}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h .grow{flex:1}
.sum-t{font-size:16px;font-weight:600;margin:2px 0 6px;line-height:1.35}
.sum-p{margin:0 0 10px;color:var(--ink);line-height:1.65}
.sum-l{margin:0 0 10px;padding-inline-start:18px;line-height:1.6}
.sum-l li{margin-bottom:3px}
.sum-k{font-size:12px;color:var(--ink-3);margin:10px 0 4px;font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.tag.ai{background:var(--brass-soft);color:var(--brass)}
.tag button{border:0;background:none;padding:0;color:inherit;display:grid;place-items:center}
.tag svg.i{width:11px;height:11px}
.tag-in{inline-size:110px;block-size:26px!important;font-size:12px;border-radius:999px!important}
.senti{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-3)}
.ai-empty{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--ink-2);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ai-err{color:var(--danger);font-size:13px;background:var(--danger-soft);border-radius:8px;padding:8px 10px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.tr-list{display:flex;flex-direction:column;gap:2px;max-block-size:none}
.seg-r{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:5px 6px;border-radius:7px;line-height:1.6}
.seg-r.on{background:var(--teal-soft)}
.seg-r .ts{border:0;background:none;padding:0;color:var(--teal);font-size:12px;font-variant-numeric:tabular-nums;text-align:start;align-self:start;margin-top:2px}
.seg-r .ts:disabled{color:var(--ink-3);cursor:default}
.seg-r .sp{font-size:11px;font-weight:600;margin-inline-end:6px;padding:0 6px;border-radius:4px;background:var(--surface-3);color:var(--ink-2)}
.seg-r .sp.s1{background:var(--teal-soft);color:var(--teal)}
.seg-r .sp.s2{background:var(--brass-soft);color:var(--brass)}
.tr-meta{font-size:11px;color:var(--ink-3);margin-top:8px}
.as-file{padding:12px 16px 20px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line-2);word-break:break-all;line-height:1.7}
.ask-row{display:flex;gap:6px}
.ask-row .inp{flex:1}
.answer{margin-top:10px;line-height:1.7;font-size:14px}
.answer p{margin:0 0 8px}
.answer ul{margin:0 0 8px;padding-inline-start:18px}
.mini-rows .row{grid-template-columns:118px minmax(0,1fr) 56px 30px;padding:5px 6px}
.mini-rows .r-time,.row.sd .r-time{white-space:nowrap}
.mini-rows .row .av,.mini-rows .row .r-tape,.mini-rows .row .r-flags,.mini-rows .row .ib.star{display:none}
.cstats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:14px 16px 0;border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.cstats div{padding:10px 12px;border-bottom:1px solid var(--line-2);border-inline-start:1px solid var(--line-2)}
.cstats div:nth-child(odd){border-inline-start:0}
.cstats span{display:block;font-size:11px;color:var(--ink-3)}
.cstats b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cmon{display:flex;align-items:flex-end;gap:3px;block-size:60px;margin-top:8px}
.cmon i{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-block-size:1px;opacity:.85}
.cmon-x{display:flex;gap:3px;font-size:10px;color:var(--ink-3)}
.cmon-x span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}

/* ---------- player ---------- */
footer#player{grid-area:player;display:grid;grid-template-columns:minmax(150px,240px) auto minmax(0,1fr) auto;align-items:center;gap:18px;padding:10px 18px;background:var(--surface);border-top:1px solid var(--line);min-block-size:72px}
footer#player.idle .p-ctrls,footer#player.idle .p-wave,footer#player.idle .p-extra{opacity:.45;pointer-events:none}
.p-info{display:flex;align-items:center;gap:10px;min-inline-size:0;border:0;background:none;padding:0;text-align:start}
.p-info .t{min-inline-size:0;line-height:1.3}
.p-info b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.p-ctrls{display:flex;align-items:center;gap:4px;direction:ltr}
.p-play{inline-size:44px;block-size:44px;border-radius:50%;border:0;background:var(--teal);color:var(--on-teal);display:grid;place-items:center}
.p-play:hover{background:var(--teal-2)}
.p-play svg.i{width:20px;height:20px}
.p-wave{display:flex;align-items:center;gap:10px;direction:ltr;min-inline-size:0}
.p-wave canvas{flex:1;block-size:46px;min-inline-size:0;cursor:pointer;display:block}
.p-wave .tnum{font-size:12px;color:var(--ink-2);min-inline-size:44px;text-align:center}
.p-extra{display:flex;align-items:center;gap:6px}
.speed{min-inline-size:48px;block-size:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.tgl input{accent-color:var(--teal)}

/* ---------- modal / toast / tip / jobs ---------- */
.mback{position:fixed;inset:0;z-index:60;background:rgba(8,18,16,.42);display:grid;place-items:center;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);inline-size:min(560px,100%);max-block-size:calc(100vh - 40px);display:flex;flex-direction:column;border:1px solid var(--line)}
.modal.wide{inline-size:min(820px,100%)}
.m-head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.m-head h2{margin:0;font-size:18px;font-weight:600;flex:1}
.m-body{padding:4px 18px 16px;overflow:auto;line-height:1.6}
.m-foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 18px 16px;border-top:1px solid var(--line-2)}
.m-foot:empty{display:none}
.m-foot .grow{flex:1}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld>label{font-size:13px;font-weight:500}
.fld .hint{font-size:12px;color:var(--ink-3)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.set-sec{border:1px solid var(--line-2);border-radius:12px;padding:14px 14px 2px;margin-bottom:14px}
.set-sec h3{margin:0 0 12px;font-size:15px}
.keyrow{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:10px}
.keyrow .lbl{font-size:13px;font-weight:500}
.keyrow .lbl a{display:block;font-size:11px;font-weight:400;color:var(--teal)}
.keyrow .st{font-size:12px;grid-column:2/-1;margin-top:-6px}
.st.ok{color:var(--teal)}.st.err{color:var(--danger)}
.folders{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.folder{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:10px}
.folder .fi{color:var(--teal)}
.folder b{font-weight:600}
.folder small{display:block;color:var(--ink-3);font-size:12px}
.folder .acts{display:flex;gap:4px}
.prog{block-size:6px;background:var(--surface-3);border-radius:3px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;block-size:100%;background:var(--teal);inline-size:0;transition:inline-size .2s}
.sync-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:12px}
.sync-res div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.sync-res b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sync-res span{font-size:12px;color:var(--ink-2)}
.sync-res .main b{color:var(--teal)}
.note{font-size:12px;color:var(--ink-3)}
#toasts{position:fixed;inset-block-end:92px;inset-inline-start:50%;transform:translateX(50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;max-inline-size:520px;transition:opacity .3s,transform .3s;pointer-events:auto}
.toast.err{background:var(--danger);color:#fff}
.toast.out{opacity:0;transform:translateY(8px)}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--ink);color:var(--surface);font-size:12px;padding:6px 9px;border-radius:7px;white-space:pre-line;max-inline-size:280px;line-height:1.45;box-shadow:var(--shadow)}
#jobs{position:fixed;inset-block-end:90px;inset-inline-start:18px;z-index:50;inline-size:330px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px}
#jobs .j-h{display:flex;align-items:center;gap:8px;font-size:13px}
#jobs .j-h b{font-weight:600}
#jobs .j-t{font-size:12px;color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#jobs .j-e{font-size:12px;color:var(--danger);margin-top:4px}

@media (max-width:1100px){
  #app.has-aside{grid-template-columns:0 minmax(0,1fr) minmax(340px,420px)}
  #app.has-aside nav.side{display:none}
  .cal-main{grid-template-columns:1fr}
}
@media (max-width:820px){
  #app,#app.has-aside{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "nav" "main" "player"}
  header.top{flex-wrap:wrap;padding:10px 16px;gap:10px;min-inline-size:0}
  .search .kbd,.search .lbl{display:none}
  .fbar .contact-in{inline-size:140px}
  .brand{inline-size:auto}
  .search{order:3;flex-basis:100%}
  nav.side{flex-direction:row;padding:6px 10px;border-inline-end:0;border-bottom:1px solid var(--line);overflow-x:auto}
  nav.side .nav-b{inline-size:auto;flex:none}
  nav.side .side-sep,nav.side .side-h,nav.side .side-fav,nav.side .side-foot,.nav-b .cnt{display:none}
  #app.has-aside nav.side{display:flex}
  aside#aside{position:fixed;inset:0;z-index:40;border:0}
  .row,.row.sd{grid-template-columns:auto 30px minmax(0,1fr) 54px 30px;padding:6px 4px}
  .row .r-tape,.row .r-flags,.row .ib.star{display:none}
  .fbar,.resbar,.chips,.fbar2{padding-inline:16px}
  footer#player{grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:8px 16px}
  .p-wave{grid-column:1/-1;order:3}
  .p-extra{display:none}
  .cal,.stats,.ppl{padding:14px 16px}
  .ptable .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mark"><svg class="i" viewBox="0 0 24 24"><circle cx="6.5" cy="12" r="3.5"/><circle cx="17.5" cy="12" r="3.5"/><path d="M6.5 15.5h11"/></svg></span><span>ארכיון שיחות</span></div>
    <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="חיפוש לפי שם, מספר, או מילים מתוך השיחות" autocomplete="off"><span class="kbd">/</span><button class="btn sm ai" id="aiSearchBtn" type="button" title="כתוב מה אתה מחפש במילים שלך, וה-AI יגדיר את הסינון"><svg class="i" viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9-1.9 5.1-1.9-5.1-5.1-1.9 5.1-1.9z"/><path d="M19 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg><span class="lbl">חיפוש חכם</span></button></label>
    <div class="top-actions">
      <button class="btn primary" id="syncBtn" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.6L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.6L20 16"/><path d="M20 20v-4h-4"/></svg><span>סנכרון</span></button>
      <button class="ib" id="foldersBtn" type="button" title="תיקיות מסונכרנות"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></button>
      <button class="ib" id="settingsBtn" type="button" title="הגדרות ומפתחות AI"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
    </div>
  </header>

  <nav class="side" id="nav"></nav>

  <main>
    <div id="filters"></div>
    <div id="banner"></div>
    <section id="view" tabindex="-1"></section>
  </main>

  <aside id="aside"></aside>

  <footer id="player" class="idle">
    <button class="p-info" id="pInfo" type="button" title="פתח את פרטי השיחה"><span class="av" id="pAv" style="--hue:170">–</span><span class="t"><b id="pWho">לא נבחרה הקלטה</b><small id="pWhen">לחץ על ▶ ליד שיחה כדי לנגן</small></span></button>
    <div class="p-ctrls">
      <button class="ib" id="pPrev" type="button" title="השיחה הקודמת ברשימה"><svg class="i" viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 6 9.5 12 18 18z" fill="currentColor"/></svg></button>
      <button class="ib" id="pBack" type="button" title="10 שניות אחורה"><svg class="i" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 4v4h4"/><text x="12" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial">10</text></svg></button>
      <button class="p-play" id="pPlay" type="button" title="נגן / השהה (רווח)"></button>
      <button class="ib" id="pFwd" type="button" title="10 שניות קדימה"><svg class="i" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M20 4v4h-4"/><text x="12" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="Arial">10</text></svg></button>
      <button class="ib" id="pNext" type="button" title="השיחה הבאה ברשימה"><svg class="i" viewBox="0 0 24 24"><path d="M18 5v14"/><path d="M6 6l8.5 6L6 18z" fill="currentColor"/></svg></button>
    </div>
    <div class="p-wave"><span class="tnum" id="pCur">0:00</span><canvas id="pCanvas"></canvas><span class="tnum" id="pDur">0:00</span></div>
    <div class="p-extra">
      <button class="speed" id="pSpeed" type="button" dir="ltr" title="מהירות ניגון">1×</button>
      <label class="tgl" title="בסיום שיחה, לנגן את הבאה ברשימה"><input type="checkbox" id="pAuto">רצף</label>
    </div>
    <audio id="audio" preload="auto"></audio>
  </footer>
</div>
<div id="modals"></div>
<div id="toasts"></div>
<div id="tip" hidden></div>
<div id="jobs" hidden></div>
<input type="file" id="dirInput" webkitdirectory directory multiple hidden>
<input type="file" id="jsonInput" accept=".json,application/json" hidden>
<script>
'use strict';
/* =====================================================================
   ארכיון שיחות — קובץ אחד, רץ מקומית בדפדפן (Chrome / Edge)
   הקבצים נקראים מהמחשב בלבד. פניות AI יוצאות ישירות לספק שבחרת.
   ===================================================================== */

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function sttChunks(r, maxSec) {

  const per = Math.floor(maxSec * sr), out = [];
  let i = 0;

    out.push({ blob: pcmWav(pcm.subarray(i, end), sr), offset: i / sr, mime: 'audio/wav', name: 'call.wav' });
    i = end;

function corpusOf(recs, maxChars = 140000) {
  const withAI = recs.filter(r => r.sum || r.tr).sort((a, b) => b.ts - a.ts);
  let s = '', used = 0;
  for (const r of withAI) {
    let block = `### ${r._.who} | ${fmtDayLong(r.ts, true)} ${fmtTime(r.ts)} | ${fmtDur(r.dur)}\n`;
    if (r.sum) {
      block += `נושא: ${r.sum.title}\nתקציר: ${r.sum.summary}\n`;
      if (r.sum.points?.length) block += `נקודות: ${r.sum.points.join('; ')}\n`;
      if (r.sum.actions?.length) block += `משימות/סיכומים: ${r.sum.actions.join('; ')}\n`;
      if (r.sum.dates?.length) block += `מועדים: ${r.sum.dates.join('; ')}\n`;
      if (r.tr && withAI.length <= 6) block += `תמלול:\n${trText(r, 12000)}\n`;
    } else block += `תמלול:\n${trText(r, withAI.length <= 6 ? 20000 : 3500)}\n`;
    if (s.length + block.length > maxChars) break;

  if (p === 'gemini') { const j = await api(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`, {}, 'Gemini'); return (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => m.name.replace(/^models\//, '')); }
  if (p === 'openai') { const j = await api('https://api.openai.com/v1/models', { headers: { authorization: 'Bearer ' + key } }, 'OpenAI'); return (j.data || []).map(m => m.id).sort(); }
  if (p === 'groq') { const j = await api('https://api.groq.com/openai/v1/models', { headers: { authorization: 'Bearer ' + key } }, 'Groq'); return (j.data || []).map(m => m.id).sort(); }
  if (p === 'anthropic') { const j = await api('https://api.anthropic.com/v1/models?limit=100', { headers: { 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' } }, 'Claude'); return (j.data || []).map(m => m.id); }
  if (p === 'elevenlabs') { await api('https://api.elevenlabs.io/v1/models', { headers: { 'xi-api-key': key } }, 'ElevenLabs'); return []; }
  return [];
}

function toast(msg, type = '') {

  $('#toasts').append(t); setTimeout(() => t.classList.add('out'), type === 'err' ? 6500 : 3800); setTimeout(() => t.remove(), type === 'err' ? 7000 : 4300);
}
(() => {
  const tip = $('#tip'); let cur = null;
  document.addEventListener('mouseover', e => {
    const el = e.target.closest?.('[data-tip]'); if (el === cur) return; cur = el;
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect(), tr = tip.getBoundingClientRect();
    let x = r.left + r.width / 2 - tr.width / 2, y = r.top - tr.height - 8;
    if (y < 6) y = r.bottom + 8;
    tip.style.left = clamp(x, 6, innerWidth - tr.width - 6) + 'px'; tip.style.top = y + 'px';
  });
  document.addEventListener('scroll', () => { tip.hidden = true; cur = null; }, true);
})();
function modal({ title, body = '', wide = false, actions = [], onClose }) {
  const back = h(`<div class="mback"><div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="m-head"><h2>${esc(title)}</h2><button class="ib" data-close title="סגירה">${I.x}</button></div><div class="m-body"></div><div class="m-foot"></div></div></div>`);
  const m = back.firstElementChild, bodyEl = $('.m-body', m), foot = $('.m-foot', m);
  if (typeof body === 'string') bodyEl.innerHTML = body; else bodyEl.append(body);
  let closed = false;
  const close = () => { if (closed) return; closed = true; back.remove(); document.removeEventListener('keydown', onKey); onClose?.(); };
  const onKey = e => { if (e.key === 'Escape' && $('#modals').lastElementChild === back) close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  $('[data-close]', m).onclick = close;
  const setActions = acts => {
    foot.innerHTML = '';
    for (const a of acts) {
      if (a === 'grow') { foot.append(h('<span class="grow"></span>')); continue; }
      const b = h(`<button class="btn ${a.cls || ''}" type="button">${a.icon || ''}${esc(a.label)}</button>`);
      b.onclick = () => a.onClick ? a.onClick(close, b) : close(); foot.append(b);
    }
  };
  setActions(actions);
  $('#modals').append(back);
  setTimeout(() => ($('[autofocus]', m) || $('.m-foot .btn.primary', m))?.focus(), 30);
  return { el: m, body: bodyEl, close, setActions };
}

    modal({ title, body: `<p style="margin:0">${text}</p>`, actions: [{ label: okLabel, cls, onClick: c => { v = true; c(); } }, { label: 'ביטול' }], onClose: () => res(v) });

}
function downloadBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
function showErr(e, ctx) {

const tapeW = d => Math.max(2, Math.min(100, Math.log10(1 + (d || 0)) / Math.log10(1 + 2400) * 100));
function hl(text) {
  const s = esc(text); const q = norm(S.f.q); if (!q) return s;
  const terms = q.split(/\s+/).filter(t => t.length > 1).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  if (!terms.length) return s;
  try { return s.replace(new RegExp(`(${terms.join('|')})`, 'gi'), '<mark>$1</mark>'); } catch { return s; }
}

let listObs = null;
function renderList() {
  const list = S.filtered;
  if (!list.length) {
    viewEl.innerHTML = `<div class="empty"><h2>אין הקלטות שמתאימות לסינון</h2><p>נסה לשנות את מילות החיפוש או להרחיב את טווח התאריכים.</p><button class="btn" data-act="clear-filter" type="button">ניקוי הסינון</button></div>`; return;
  }
  const grouped = S.f.sort === 'new' || S.f.sort === 'old';
  const items = [];
  if (grouped) {
    const tot = new Map();
    for (const r of list) { const t = tot.get(r._.dk) || { n: 0, s: 0 }; t.n++; t.s += r.dur || 0; tot.set(r._.dk, t); }
    let last = null;
    for (const r of list) { if (r._.dk !== last) { last = r._.dk; items.push({ day: last, ...tot.get(last) }); } items.push(r); }
  } else items.push(...list);
  viewEl.innerHTML = '<div class="list" id="list"></div><div class="sentinel" id="sentinel"></div>';
  const listEl = $('#list'); let pos = 0; let cur = null;
  const today = dkey(Date.now()), yest = dkey(Date.now() - 864e5);
  const more = () => {
    let html = ''; const end = Math.min(items.length, pos + 300);
    const parts = [];
    for (; pos < end; pos++) {
      const it = items[pos];
      if (it.day) {
        if (cur !== null) parts.push('</div>');
        const ts = dkeyToTs(it.day);
        parts.push(`<div class="day" data-day="${it.day}"><div class="day-h"><span class="day-n">${fmtDayLong(ts)}</span>${it.day === today ? '<span class="badge">היום</span>' : it.day === yest ? '<span class="badge">אתמול</span>' : ''}<span class="day-t">${fmtTotal(it.s)}</span><span class="day-c">${nf(it.n)} שיחות</span></div>`);
        cur = it.day;
      } else parts.push(rowHTML(it, !grouped));
    }
    html = parts.join('');
    // append: continue an open day group if needed
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const lastDay = listEl.lastElementChild;
    if (lastDay && lastDay.classList.contains('day')) { while (tmp.firstChild && tmp.firstChild.classList?.contains('row')) lastDay.append(tmp.firstChild); }
    listEl.append(...tmp.childNodes);
    if (pos >= items.length) { listObs?.disconnect(); $('#sentinel')?.remove(); }
  };
  more();
  listObs?.disconnect();
  listObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) more(); }, { root: viewEl, rootMargin: '600px' });
  const sen = $('#sentinel'); if (sen) listObs.observe(sen);
}

/* people */
function peopleAgg(list) {
  const months = [...new Set(S.recs.map(r => r._.mk))].sort();
  const mi = new Map(months.map((m, i) => [m, i]));
  const m = new Map();
  for (const r of list) {
    let c = m.get(r._.who);
    if (!c) { c = { who: r._.who, isTel: r._.isTel, phone: r._.phone, n: 0, s: 0, last: 0, first: Infinity, tr: 0, mon: new Array(months.length).fill(0) }; m.set(r._.who, c); }
    c.n++; c.s += r.dur || 0; if (r.ts > c.last) c.last = r.ts; if (r.ts < c.first) c.first = r.ts; if (r.sum) c.tr++;
    c.mon[mi.get(r._.mk)] += r.dur || 0;
  }
  return { list: [...m.values()], months };
}

    <div class="bc-x">${items.map((it, i) => `<span>${i % labelEvery === 0 ? esc(it.short ?? it.label) : ''}</span>`).join('')}</div>`;

/* ---------- AI jobs ---------- */
S.ctrl = new Map();
async function runOne(r, mode) {
  if (S.busy.has(r.id)) return;
  const ctrl = new AbortController(); S.ctrl.set(r.id, ctrl);
  const step = s => { S.busy.set(r.id, s); updateRow(r.id); if (S.aside?.id === r.id) renderAside(); };
  S.errors.delete(r.id);
  try {
    if (mode === 'tr') await transcribeRec(r, { signal: ctrl.signal, onStep: step });
    else await summarizeRec(r, { signal: ctrl.signal, onStep: step });
    if (mode === 'both' && !r.sum) await summarizeRec(r, { signal: ctrl.signal, onStep: step });
  } catch (e) {
    if (e.name !== 'AbortError') { if (e.code === 'nokey' || e.code === 'perm' || e.code === 'resync') showErr(e); else S.errors.set(r.id, e.message); }
    S.busy.delete(r.id); S.ctrl.delete(r.id); updateRow(r.id); if (S.aside?.id === r.id) renderAside();
    return false;
  }
  S.busy.delete(r.id); S.ctrl.delete(r.id); rebuildIndexes(); updateRow(r.id); if (S.aside?.id === r.id) renderAside(); renderResbar();
  return true;
}
const Jobs = { running: false, stop: false, done: 0, fail: 0, total: 0, lastErr: '' };
async function startBatch(recs) {
  if (Jobs.running) { toast('כבר רץ עיבוד. אפשר לעצור אותו בחלונית למטה.'); return; }
  const min = +S.settings.batchMinSec || 0;
  const todo = recs.filter(r => !r.sum && (r.dur || 0) >= min);
  const skipped = recs.filter(r => !r.sum).length - todo.length;
  if (!todo.length) { toast(skipped ? `כל השיחות שנשארו קצרות מ-${min} שניות` : 'כל השיחות כבר מסוכמות'); return; }
  const sec = todo.reduce((a, r) => a + (todo.length && !r.tr ? r.dur : 0), 0);
  try { needKey(STT_PROV[S.settings.sttProvider].key); needKey(LLM_PROV[S.settings.llmProvider].key); } catch (e) { showErr(e); return; }
  const ok = await confirmBox('תמלול וסיכום', `יתומללו ויסוכמו <b>${nf(todo.length)}</b> שיחות (${fmtTotal(sec)} אודיו לתמלול)${skipped ? `, בלי ${nf(skipped)} שיחות קצרות מ-${min} שניות` : ''}.<br>תמלול: ${esc(STT_PROV[S.settings.sttProvider].label)}. סיכום: ${esc(LLM_PROV[S.settings.llmProvider].label)}.<br><span class="note">הפעולה משתמשת במפתחות ה-API שלך ועשויה לעלות כסף אצל הספק. אפשר לעצור בכל רגע.</span>`, 'התחלה');
  if (!ok) return;

  renderJobs();

  const worker = async () => {
    while (queue.length && !Jobs.stop) {
      const r = queue.shift();
      const ok = await runOne(r, 'both');
      if (ok) Jobs.done++; else { Jobs.fail++; Jobs.lastErr = S.errors.get(r.id) || ''; if (/המפתח נדחה|חסר מפתח/.test(Jobs.lastErr) || Jobs.fail >= 8 && Jobs.done === 0) Jobs.stop = true; if (/429/.test(Jobs.lastErr)) await sleep(15000); }
      renderJobs();
    }
  };
  await Promise.all(Array.from({ length: conc }, worker));
  Jobs.running = false; renderJobs();
  toast(`הסתיים: ${nf(Jobs.done)} שיחות סוכמו${Jobs.fail ? `, ${nf(Jobs.fail)} נכשלו` : ''}`, Jobs.fail && !Jobs.done ? 'err' : '');

}

  el.innerHTML = `<div class="j-h">${Jobs.running ? '<span class="spin" style="color:var(--brass)"></span>' : ''}<b>${Jobs.running ? (Jobs.stop ? 'עוצר…' : 'תמלול וסיכום') : 'העיבוד הסתיים'}</b><span class="num">${nf(Jobs.done + Jobs.fail)} / ${nf(Jobs.total)}</span><span class="grow" style="flex:1"></span>${Jobs.running ? '<button class="btn sm" id="jStop">עצירה</button>' : '<button class="ib sm" id="jClose" title="סגירה">' + I.x + '</button>'}</div>

/* ---------- import phone contacts (VCF / CSV) to name unknown numbers ---------- */
function decodeQP(s) {

  for (let i = 0; i < s.length; i++) { if (s[i] === '=' && /^[0-9A-F]{2}$/i.test(s.substr(i + 1, 2))) { bytes.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; } else bytes.push(s.charCodeAt(i) & 255); }

}
function parseVCF(text) {

  }

}
function parseCSV(text) {

    else if (c === '"') q = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; } else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  if (rows.length < 2) return [];
  const hd = rows[0].map(x => x.replace(/^﻿/, '').trim());
  const nameCols = ['Name', 'Display Name', 'Full Name', 'שם', 'שם מלא'].map(x => hd.indexOf(x)).filter(i => i >= 0);
  const fn = hd.findIndex(x => /^(first name|given name|שם פרטי)$/i.test(x)), mn = hd.findIndex(x => /^(middle name)$/i.test(x)), ln = hd.findIndex(x => /^(last name|family name|שם משפחה)$/i.test(x));
  const telCols = hd.map((x, i) => (/phone|mobile|טלפון|נייד/i.test(x) && !/type|label|סוג/i.test(x)) ? i : -1).filter(i => i >= 0);
  const out = [];
  for (const r of rows.slice(1)) {
    let name = nameCols.map(i => r[i]).find(Boolean) || [fn, mn, ln].filter(i => i >= 0).map(i => r[i]).filter(Boolean).join(' ');
    const tels = telCols.flatMap(i => String(r[i] || '').split(/\s*:::\s*|[;\/]/)).filter(x => /\d{5,}/.test(x));

}

/* drag & drop a folder */
let dragDepth = 0, dropHint = null;
window.addEventListener('dragenter', e => { if (![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); dragDepth++; if (!dropHint) { dropHint = h('<div class="drop-hint"><div>שחרר כאן תיקיית הקלטות לסנכרון</div></div>'); document.body.append(dropHint); } });
window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) { dropHint?.remove(); dropHint = null; } });
window.addEventListener('drop', async e => {
  e.preventDefault(); dragDepth = 0; dropHint?.remove(); dropHint = null;
  const items = [...(e.dataTransfer?.items || [])].filter(i => i.kind === 'file');
  const handles = [];
  for (const it of items) { if (it.getAsFileSystemHandle) { try { const hnd = await it.getAsFileSystemHandle(); if (hnd) handles.push(hnd); } catch { } } }
  const dirs = handles.filter(x => x.kind === 'directory');
  if (dirs.length) { const fs = []; for (const d of dirs) fs.push(await folderFromHandle(d)); await runSync(fs); return; }
  const files = [...(e.dataTransfer?.files || [])].filter(f => AUDIO_RE.test(f.name));
  if (files.length) { const f = await folderForInput('קבצים שנגררו'); await runSync([f], new Map([[f.id, files.map(file => ({ file, name: file.name, path: [] }))]])); return; }
  toast('גרור תיקייה עם קבצי הקלטה, או השתמש בכפתור הסנכרון');
});

document.addEventListener('keydown', e => {
  const tag = e.target.tagName, typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable;
  if ($('#modals').children.length) return;
  if (e.key === 'Escape') { if (typing) { e.target.blur(); return; } if (S.aside) closeAside(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); qInput.focus(); qInput.select(); }
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight' && P.entry) { e.preventDefault(); P.audio.currentTime = Math.min(P.audio.duration || 0, P.audio.currentTime + 5); tick(); }
  else if (e.key === 'ArrowLeft' && P.entry) { e.preventDefault(); P.audio.currentTime = Math.max(0, P.audio.currentTime - 5); tick(); }
  else if (e.key === 'j' || e.key === 'J' || e.key === 'ח') { const n = neighbor(1); if (n) { play(n.id); if (S.aside?.type === 'rec') openRec(n.id); } }
  else if (e.key === 'k' || e.key === 'K' || e.key === 'ל') { const n = neighbor(-1); if (n) { play(n.id); if (S.aside?.type === 'rec') openRec(n.id); } }
});
